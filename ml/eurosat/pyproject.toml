[project]
name = "eurosat-landcover"
version = "0.1.0"
description = "Fine-tune ResNet-18 on EuroSAT (Sentinel-2 RGB) and export a quantized ONNX model for in-browser inference."
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "onnx>=1.17",
  "onnxscript>=0.2",
  "onnxruntime>=1.20",
  "numpy",
  "pillow",
  "tqdm",
]

# CUDA 12.8 wheels (required for RTX 50-series / Blackwell). Falls back to CPU wheels on macOS.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[tool.uv]
package = false
